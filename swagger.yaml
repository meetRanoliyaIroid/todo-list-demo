openapi: 3.0.0

info:
  title: Todo List API
  description: RESTful API for managing todo items. This API allows you to create, retrieve, and update todo items.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Todos
    description: Todo management operations

paths:
  /todos:
    get:
      summary: Get all todos
      description: Retrieve a list of all todo items
      tags:
        - Todos
      responses:
        "200":
          description: Successfully retrieved todos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Todos fetched successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Create a new todo
      description: Create a new todo item with the provided text
      tags:
        - Todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: The text content of the todo item
                  example: "Buy groceries"
      responses:
        "201":
          description: Todo created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Todo created successfully"
                  data:
                    $ref: "#/components/schemas/Todo"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /todos/{id}:
    put:
      summary: Update todo status
      description: Update the completed status of a todo item
      tags:
        - Todos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the todo item to update
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - completed
              properties:
                completed:
                  type: boolean
                  description: The completion status of the todo
                  example: true
      responses:
        "200":
          description: Todo updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Todo updated successfully"
                  data:
                    $ref: "#/components/schemas/Todo"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a todo
      description: Delete a todo item by its ID
      tags:
        - Todos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the todo item to delete
          example: 1
      responses:
        "200":
          description: Todo deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Todo deleted successfully"
                  data:
                    type: "null"
                    example: null
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the todo
          example: 1
        text:
          type: string
          description: The text content of the todo
          example: "Buy groceries"
        completed:
          type: boolean
          description: Whether the todo is completed
          example: false
        created_at:
          type: string
          format: date-time
          description: Timestamp when the todo was created
          example: "2024-01-01T00:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the todo was last updated
          example: "2024-01-01T00:00:00.000Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Error message describing what went wrong
          example: "Validation error or error message"

